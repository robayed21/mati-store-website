<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mati Store Admin Panel | Order Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-body {
      background-color: #f1f5f9;
      padding-bottom: 4rem;
    }
    .admin-header {
      background: #0f172a;
      color: white;
      padding: 1.25rem 0;
      margin-bottom: 2rem;
    }
    .admin-header .nav-wrapper {
      height: auto;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .stat-label {
      font-size: 0.8125rem;
      color: var(--color-muted);
      font-weight: 600;
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--color-ink);
      margin-top: 0.25rem;
    }
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .admin-table-card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .admin-table th {
      background: #f8fafc;
      padding: 1rem 1.25rem;
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--color-ink-soft);
      text-transform: uppercase;
      border-bottom: 1px solid var(--color-border);
    }
    .admin-table td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--color-border);
      font-size: 0.875rem;
      vertical-align: middle;
    }
    .order-id-badge {
      font-weight: 800;
      color: var(--color-brand);
      background: var(--color-brand-light);
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
    }
    .status-select {
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid var(--color-border);
      cursor: pointer;
    }
    .status-select.Pending { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .status-select.Confirmed { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .status-select.Delivered { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .status-select.Cancelled { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    
    .wa-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: #16a34a;
      font-weight: 700;
      text-decoration: none;
    }
    .wa-link:hover { text-decoration: underline; }

    /* Admin Auth Modal Overlay */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background: white;
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
  </style>
</head>
<body class="admin-body">

  <!-- Admin Login Overlay Modal -->
  <div class="login-overlay" id="adminLoginOverlay">
    <div class="login-card">
      <div class="logo-badge" style="display: inline-block; margin-bottom: 1rem;">MATI STORE</div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">এডমিন প্যানেল লগইন</h2>
      <p style="font-size: 0.875rem; color: #64748b; margin-bottom: 1.5rem;" class="bn">অর্ডার ম্যানেজমেন্টে ঢুকতে এডমিন পাসওয়ার্ড দিন</p>
      
      <form id="adminLoginForm">
        <div class="form-group" style="margin-bottom: 1rem; text-align: left;">
          <label class="form-label bn" for="adminPasscode">এডমিন পাসওয়ার্ড (Default: admin123)</label>
          <input type="password" id="adminPasscode" class="form-input" placeholder="••••••••" required>
        </div>
        <div id="loginErrorMsg" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;" class="bn"></div>
        <button type="submit" class="btn btn-primary bn" style="width: 100%; font-size: 1rem; padding: 0.85rem;">
          লগইন করুন
        </button>
      </form>
    </div>
  </div>

  <header class="admin-header">
    <div class="container">
      <div class="nav-wrapper">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <a href="index.html" class="logo-link" style="text-decoration: none;">
            <div class="logo-badge">MATI STORE</div>
          </a>
          <span style="font-size: 1.1rem; font-weight: 700; color: #94a3b8;">Admin Dashboard</span>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <a href="index.html" class="btn btn-outline" style="color: white; border-color: #334155;">View Store</a>
          <button id="adminLogoutBtn" class="btn btn-outline" style="color: #f87171; border-color: #ef4444; display: none;">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Metrics Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-value" id="statTotalOrders">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Sales Revenue</div>
        <div class="stat-value" id="statTotalRevenue">৳0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Orders</div>
        <div class="stat-value" style="color: #d97706;" id="statPendingOrders">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Delivered Orders</div>
        <div class="stat-value" style="color: #16a34a;" id="statDeliveredOrders">0</div>
      </div>
    </div>

    <!-- Controls & Filters -->
    <div class="controls-bar">
      <div style="display: flex; gap: 0.5rem;" id="statusFilters">
        <button class="tab-btn active" data-status="all">All Orders</button>
        <button class="tab-btn" data-status="Pending">Pending</button>
        <button class="tab-btn" data-status="Confirmed">Confirmed</button>
        <button class="tab-btn" data-status="Delivered">Delivered</button>
        <button class="tab-btn" data-status="Cancelled">Cancelled</button>
      </div>

      <div style="display: flex; gap: 0.5rem; flex: 1; max-width: 360px;">
        <input type="text" id="adminSearchInput" class="form-input" placeholder="Search order ID, name, phone...">
      </div>
    </div>

    <!-- Orders Table -->
    <div class="admin-table-card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Tracking ID</th>
            <th>Customer Info</th>
            <th>Address</th>
            <th>Product Title</th>
            <th>Total Price</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <!-- Populated by admin JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    let currentFilter = 'all';
    let adminToken = sessionStorage.getItem('adminToken') || '';

    document.addEventListener('DOMContentLoaded', () => {
      checkAuthAndLoad();

      document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        handleLogin();
      });

      document.getElementById('adminLogoutBtn').addEventListener('click', () => {
        sessionStorage.removeItem('adminToken');
        adminToken = '';
        document.getElementById('adminLoginOverlay').style.display = 'flex';
        document.getElementById('adminLogoutBtn').style.display = 'none';
      });

      document.getElementById('adminSearchInput').addEventListener('input', (e) => {
        if (adminToken) loadOrders(currentFilter, e.target.value.trim());
      });

      document.querySelectorAll('#statusFilters .tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#statusFilters .tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.getAttribute('data-status');
          if (adminToken) loadOrders(currentFilter, document.getElementById('adminSearchInput').value.trim());
        });
      });
    });

    async function handleLogin() {
      const passcode = document.getElementById('adminPasscode').value;
      const errorMsg = document.getElementById('loginErrorMsg');
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode })
        });
        const data = await res.json();

        if (data.success && data.token) {
          adminToken = data.token;
          sessionStorage.setItem('adminToken', adminToken);
          document.getElementById('adminLoginOverlay').style.display = 'none';
          document.getElementById('adminLogoutBtn').style.display = 'inline-block';
          loadStats();
          loadOrders();
        } else {
          errorMsg.innerText = data.message || 'ভুল পাসওয়ার্ড!';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorMsg.innerText = 'সার্ভারের সাথে সংযোগ স্থাপন করতে সমস্যা হচ্ছে!';
        errorMsg.style.display = 'block';
      }
    }

    function checkAuthAndLoad() {
      if (adminToken) {
        document.getElementById('adminLoginOverlay').style.display = 'none';
        document.getElementById('adminLogoutBtn').style.display = 'inline-block';
        loadStats();
        loadOrders();
      } else {
        document.getElementById('adminLoginOverlay').style.display = 'flex';
        document.getElementById('adminLogoutBtn').style.display = 'none';
      }
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats', {
          headers: { 'x-admin-token': adminToken }
        });
        if (res.status === 401) return promptAuth();

        const data = await res.json();
        if (data.success) {
          document.getElementById('statTotalOrders').innerText = data.stats.totalOrders;
          document.getElementById('statTotalRevenue').innerText = `৳${data.stats.totalRevenue.toLocaleString('bn-BD')}`;
          document.getElementById('statPendingOrders').innerText = data.stats.pendingOrders;
          document.getElementById('statDeliveredOrders').innerText = data.stats.deliveredOrders;
        }
      } catch (err) {
        console.error('Error loading stats:', err);
      }
    }

    async function loadOrders(status = 'all', search = '') {
      try {
        const query = new URLSearchParams({ status, search });
        const res = await fetch(`/api/orders?${query}`, {
          headers: { 'x-admin-token': adminToken }
        });
        if (res.status === 401) return promptAuth();

        const data = await res.json();
        if (data.success) {
          renderTable(data.orders);
        }
      } catch (err) {
        console.error('Error loading orders:', err);
      }
    }

    function promptAuth() {
      sessionStorage.removeItem('adminToken');
      adminToken = '';
      document.getElementById('adminLoginOverlay').style.display = 'flex';
      document.getElementById('adminLogoutBtn').style.display = 'none';
    }

    function renderTable(orders) {
      const tbody = document.getElementById('adminTableBody');
      if (!orders || !orders.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 2rem; color: #94a3b8;">No orders found.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(order => `
        <tr>
          <td>
            <span class="order-id-badge">${order.id}</span>
            <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px;">
              ${new Date(order.createdAt).toLocaleDateString('bn-BD')}
            </div>
          </td>
          <td>
            <div style="font-weight: 700;">${order.customerName}</div>
            <a href="https://wa.me/880${order.customerPhone.replace(/^0/, '')}" target="_blank" class="wa-link">
              📱 ${order.customerPhone}
            </a>
          </td>
          <td style="max-width: 200px;">
            <div>${order.customerAddress}</div>
            <div style="font-size: 0.75rem; color: #64748b;">(${order.deliveryLocation === 'outside' ? 'Outside Dhaka' : 'Inside Dhaka'})</div>
          </td>
          <td style="max-width: 220px; font-weight: 600;">
            ${order.productTitle}
          </td>
          <td style="font-weight: 800; color: #0d9488;">
            ৳${order.totalPrice.toLocaleString('bn-BD')}
            <div style="font-size: 0.7rem; color: #94a3b8; font-weight: 400;">(Inc. ৳${order.deliveryFee} shipping)</div>
          </td>
          <td>
            <select class="status-select ${order.status}" onchange="updateStatus('${order.id}', this.value)">
              <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="Confirmed" ${order.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
              <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
              <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          </td>
          <td>
            <a href="https://wa.me/880${order.customerPhone.replace(/^0/, '')}?text=Hello%20${encodeURIComponent(order.customerName)},%20regarding%20your%20Mati%20Store%20Order%20${order.id}" target="_blank" class="btn btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.75rem; color: #16a34a; border-color: #bbf7d0;">
              Chat
            </a>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`/api/orders/${id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-token': adminToken
          },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.status === 401) return promptAuth();

        const data = await res.json();
        if (data.success) {
          loadStats();
          loadOrders(currentFilter, document.getElementById('adminSearchInput').value.trim());
        }
      } catch (err) {
        console.error('Error updating status:', err);
      }
    }
  </script>

</body>
</html>
